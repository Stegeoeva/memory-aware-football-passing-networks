name: Research checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-memory-lock.txt
      - name: Install tested dependencies
        run: python -m pip install -r requirements-memory-lock.txt
      - name: Run synthetic tests
        run: python -m unittest discover -s tests -v
      - name: Check publication artifacts
        run: python scripts/check_repository.py
